name: Update NFL standings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run nfl:standings:sync
      - run: npm run audit:nfl-standings
      - name: Commit a valid changed snapshot
        run: |
          if git diff --quiet -- src/data/nfl/standings.snapshot.json; then
            echo "NFL standings unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nfl/standings.snapshot.json
          git commit -m "chore: refresh NFL standings snapshot"
          git push
