name: Sync fixtures

on:
  schedule:
    # Keep final scores close to real time. GitHub schedules can be delayed at
    # the top of the hour, so use an offset and poll every five minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-fixtures-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures:sync
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
      - run: npm run fixtures:validate
      - name: Detect fixture changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/fixtures.snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build
      - name: Commit updated fixture snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fixtures.snapshot.json
          git commit -m "chore: refresh fixture snapshot"
          git push
